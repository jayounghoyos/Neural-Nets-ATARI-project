<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DQN como red neuronal</title>
<style>
  :root { --t: #1F2937; }
  body { background: #FAFAFA; margin: 24px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--t); }
  svg { display: block; max-width: 900px; margin: 0 auto; background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 20px; }
  .ts { font-size: 11px; fill: var(--t); }
  .c-gray   circle, .c-gray   rect { fill: #E2E8F0; stroke: #64748B; }
  .c-purple circle, .c-purple rect { fill: #C4B5FD; stroke: #7C3AED; }
  .c-teal   circle, .c-teal   rect { fill: #99F6E4; stroke: #0D9488; }
  .c-coral  circle, .c-coral  rect { fill: #FED7AA; stroke: #EA580C; }
</style>
</head>
<body>

<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>DQN como red neuronal</title>
  <desc>Arquitectura DQN: 3 capas convolucionales, flatten, fully connected, salida de Q-values.</desc>

  <!-- Col x: input=50, conv1=155, conv2=255, conv3=355, flatten=435, fc1=520, fc2=610 -->

  <!-- ── EDGES ── -->

  <!-- Input(4) → Conv1(8) -->
  <g stroke="#7F77DD" stroke-width="0.4" opacity="0.25" fill="none">
    <line x1="50" y1="120" x2="155" y2="82"/>  <line x1="50" y1="120" x2="155" y2="112"/>
    <line x1="50" y1="120" x2="155" y2="142"/> <line x1="50" y1="120" x2="155" y2="172"/>
    <line x1="50" y1="120" x2="155" y2="202"/> <line x1="50" y1="120" x2="155" y2="232"/>
    <line x1="50" y1="120" x2="155" y2="262"/> <line x1="50" y1="120" x2="155" y2="292"/>
    <line x1="50" y1="170" x2="155" y2="82"/>  <line x1="50" y1="170" x2="155" y2="112"/>
    <line x1="50" y1="170" x2="155" y2="142"/> <line x1="50" y1="170" x2="155" y2="172"/>
    <line x1="50" y1="170" x2="155" y2="202"/> <line x1="50" y1="170" x2="155" y2="232"/>
    <line x1="50" y1="170" x2="155" y2="262"/> <line x1="50" y1="170" x2="155" y2="292"/>
    <line x1="50" y1="220" x2="155" y2="82"/>  <line x1="50" y1="220" x2="155" y2="112"/>
    <line x1="50" y1="220" x2="155" y2="142"/> <line x1="50" y1="220" x2="155" y2="172"/>
    <line x1="50" y1="220" x2="155" y2="202"/> <line x1="50" y1="220" x2="155" y2="232"/>
    <line x1="50" y1="220" x2="155" y2="262"/> <line x1="50" y1="220" x2="155" y2="292"/>
    <line x1="50" y1="270" x2="155" y2="82"/>  <line x1="50" y1="270" x2="155" y2="112"/>
    <line x1="50" y1="270" x2="155" y2="142"/> <line x1="50" y1="270" x2="155" y2="172"/>
    <line x1="50" y1="270" x2="155" y2="202"/> <line x1="50" y1="270" x2="155" y2="232"/>
    <line x1="50" y1="270" x2="155" y2="262"/> <line x1="50" y1="270" x2="155" y2="292"/>
  </g>

  <!-- Conv1(8) → Conv2(8): dense fan -->
  <g stroke="#534AB7" stroke-width="0.4" opacity="0.22" fill="none">
    <line x1="155" y1="82"  x2="255" y2="82"/>  <line x1="155" y1="82"  x2="255" y2="142"/>
    <line x1="155" y1="82"  x2="255" y2="202"/> <line x1="155" y1="82"  x2="255" y2="262"/>
    <line x1="155" y1="112" x2="255" y2="112"/> <line x1="155" y1="112" x2="255" y2="172"/>
    <line x1="155" y1="112" x2="255" y2="232"/> <line x1="155" y1="112" x2="255" y2="292"/>
    <line x1="155" y1="142" x2="255" y2="82"/>  <line x1="155" y1="142" x2="255" y2="142"/>
    <line x1="155" y1="142" x2="255" y2="202"/> <line x1="155" y1="142" x2="255" y2="262"/>
    <line x1="155" y1="172" x2="255" y2="112"/> <line x1="155" y1="172" x2="255" y2="172"/>
    <line x1="155" y1="172" x2="255" y2="232"/> <line x1="155" y1="172" x2="255" y2="292"/>
    <line x1="155" y1="202" x2="255" y2="82"/>  <line x1="155" y1="202" x2="255" y2="142"/>
    <line x1="155" y1="202" x2="255" y2="202"/> <line x1="155" y1="202" x2="255" y2="262"/>
    <line x1="155" y1="232" x2="255" y2="112"/> <line x1="155" y1="232" x2="255" y2="172"/>
    <line x1="155" y1="232" x2="255" y2="232"/> <line x1="155" y1="232" x2="255" y2="292"/>
    <line x1="155" y1="262" x2="255" y2="82"/>  <line x1="155" y1="262" x2="255" y2="142"/>
    <line x1="155" y1="262" x2="255" y2="202"/> <line x1="155" y1="262" x2="255" y2="262"/>
    <line x1="155" y1="292" x2="255" y2="112"/> <line x1="155" y1="292" x2="255" y2="172"/>
    <line x1="155" y1="292" x2="255" y2="232"/> <line x1="155" y1="292" x2="255" y2="292"/>
  </g>

  <!-- Conv2(8) → Conv3(8) -->
  <g stroke="#3C3489" stroke-width="0.4" opacity="0.2" fill="none">
    <line x1="255" y1="82"  x2="355" y2="82"/>  <line x1="255" y1="82"  x2="355" y2="142"/>
    <line x1="255" y1="82"  x2="355" y2="202"/> <line x1="255" y1="82"  x2="355" y2="262"/>
    <line x1="255" y1="112" x2="355" y2="112"/> <line x1="255" y1="112" x2="355" y2="172"/>
    <line x1="255" y1="112" x2="355" y2="232"/> <line x1="255" y1="112" x2="355" y2="292"/>
    <line x1="255" y1="142" x2="355" y2="82"/>  <line x1="255" y1="142" x2="355" y2="142"/>
    <line x1="255" y1="142" x2="355" y2="202"/> <line x1="255" y1="142" x2="355" y2="262"/>
    <line x1="255" y1="172" x2="355" y2="112"/> <line x1="255" y1="172" x2="355" y2="172"/>
    <line x1="255" y1="172" x2="355" y2="232"/> <line x1="255" y1="172" x2="355" y2="292"/>
    <line x1="255" y1="202" x2="355" y2="82"/>  <line x1="255" y1="202" x2="355" y2="142"/>
    <line x1="255" y1="202" x2="355" y2="202"/> <line x1="255" y1="202" x2="355" y2="262"/>
    <line x1="255" y1="232" x2="355" y2="112"/> <line x1="255" y1="232" x2="355" y2="172"/>
    <line x1="255" y1="232" x2="355" y2="232"/> <line x1="255" y1="232" x2="355" y2="292"/>
    <line x1="255" y1="262" x2="355" y2="82"/>  <line x1="255" y1="262" x2="355" y2="142"/>
    <line x1="255" y1="262" x2="355" y2="202"/> <line x1="255" y1="262" x2="355" y2="262"/>
    <line x1="255" y1="292" x2="355" y2="112"/> <line x1="255" y1="292" x2="355" y2="172"/>
    <line x1="255" y1="292" x2="355" y2="232"/> <line x1="255" y1="292" x2="355" y2="292"/>
  </g>

  <!-- Conv3(8) → Flatten -->
  <g stroke="#1D9E75" stroke-width="0.4" opacity="0.3" fill="none">
    <line x1="355" y1="82"  x2="435" y2="187"/>
    <line x1="355" y1="112" x2="435" y2="187"/>
    <line x1="355" y1="142" x2="435" y2="187"/>
    <line x1="355" y1="172" x2="435" y2="187"/>
    <line x1="355" y1="202" x2="435" y2="187"/>
    <line x1="355" y1="232" x2="435" y2="187"/>
    <line x1="355" y1="262" x2="435" y2="187"/>
    <line x1="355" y1="292" x2="435" y2="187"/>
  </g>

  <!-- Flatten → FC1 -->
  <g stroke="#0F6E56" stroke-width="0.4" opacity="0.3" fill="none">
    <line x1="435" y1="187" x2="520" y2="100"/>
    <line x1="435" y1="187" x2="520" y2="140"/>
    <line x1="435" y1="187" x2="520" y2="180"/>
    <line x1="435" y1="187" x2="520" y2="220"/>
    <line x1="435" y1="187" x2="520" y2="260"/>
    <line x1="435" y1="187" x2="520" y2="300"/>
  </g>

  <!-- FC1(6) → Output(4) -->
  <g stroke="#D85A30" stroke-width="0.5" opacity="0.3" fill="none">
    <line x1="520" y1="100" x2="610" y2="140"/> <line x1="520" y1="100" x2="610" y2="187"/>
    <line x1="520" y1="100" x2="610" y2="234"/> <line x1="520" y1="100" x2="610" y2="281"/>
    <line x1="520" y1="140" x2="610" y2="140"/> <line x1="520" y1="140" x2="610" y2="187"/>
    <line x1="520" y1="140" x2="610" y2="234"/> <line x1="520" y1="140" x2="610" y2="281"/>
    <line x1="520" y1="180" x2="610" y2="140"/> <line x1="520" y1="180" x2="610" y2="187"/>
    <line x1="520" y1="180" x2="610" y2="234"/> <line x1="520" y1="180" x2="610" y2="281"/>
    <line x1="520" y1="220" x2="610" y2="140"/> <line x1="520" y1="220" x2="610" y2="187"/>
    <line x1="520" y1="220" x2="610" y2="234"/> <line x1="520" y1="220" x2="610" y2="281"/>
    <line x1="520" y1="260" x2="610" y2="140"/> <line x1="520" y1="260" x2="610" y2="187"/>
    <line x1="520" y1="260" x2="610" y2="234"/> <line x1="520" y1="260" x2="610" y2="281"/>
    <line x1="520" y1="300" x2="610" y2="140"/> <line x1="520" y1="300" x2="610" y2="187"/>
    <line x1="520" y1="300" x2="610" y2="234"/> <line x1="520" y1="300" x2="610" y2="281"/>
  </g>

  <!-- ── NODES ── -->

  <!-- Input: 4 channels = 4 frames -->
  <g class="c-gray">
    <circle cx="50" cy="120" r="9" stroke-width="0.5"/>
    <circle cx="50" cy="170" r="9" stroke-width="0.5"/>
    <circle cx="50" cy="220" r="9" stroke-width="0.5"/>
    <circle cx="50" cy="270" r="9" stroke-width="0.5"/>
  </g>

  <g class="c-purple">
    <circle cx="155" cy="82"  r="9" stroke-width="0.5"/>
    <circle cx="155" cy="112" r="9" stroke-width="0.5"/>
    <circle cx="155" cy="142" r="9" stroke-width="0.5"/>
    <circle cx="155" cy="172" r="9" stroke-width="0.5"/>
    <circle cx="155" cy="202" r="9" stroke-width="0.5"/>
    <circle cx="155" cy="232" r="9" stroke-width="0.5"/>
    <circle cx="155" cy="262" r="9" stroke-width="0.5"/>
    <circle cx="155" cy="292" r="9" stroke-width="0.5"/>
  </g>

  <g class="c-purple">
    <circle cx="255" cy="82"  r="9" stroke-width="0.5"/>
    <circle cx="255" cy="112" r="9" stroke-width="0.5"/>
    <circle cx="255" cy="142" r="9" stroke-width="0.5"/>
    <circle cx="255" cy="172" r="9" stroke-width="0.5"/>
    <circle cx="255" cy="202" r="9" stroke-width="0.5"/>
    <circle cx="255" cy="232" r="9" stroke-width="0.5"/>
    <circle cx="255" cy="262" r="9" stroke-width="0.5"/>
    <circle cx="255" cy="292" r="9" stroke-width="0.5"/>
  </g>

  <g class="c-purple">
    <circle cx="355" cy="82"  r="9" stroke-width="0.5"/>
    <circle cx="355" cy="112" r="9" stroke-width="0.5"/>
    <circle cx="355" cy="142" r="9" stroke-width="0.5"/>
    <circle cx="355" cy="172" r="9" stroke-width="0.5"/>
    <circle cx="355" cy="202" r="9" stroke-width="0.5"/>
    <circle cx="355" cy="232" r="9" stroke-width="0.5"/>
    <circle cx="355" cy="262" r="9" stroke-width="0.5"/>
    <circle cx="355" cy="292" r="9" stroke-width="0.5"/>
  </g>

  <g class="c-teal">
    <rect x="422" y="62" width="26" height="250" rx="5" stroke-width="0.5"/>
  </g>

  <g class="c-teal">
    <circle cx="520" cy="100" r="9" stroke-width="0.5"/>
    <circle cx="520" cy="140" r="9" stroke-width="0.5"/>
    <circle cx="520" cy="180" r="9" stroke-width="0.5"/>
    <circle cx="520" cy="220" r="9" stroke-width="0.5"/>
    <circle cx="520" cy="260" r="9" stroke-width="0.5"/>
    <circle cx="520" cy="300" r="9" stroke-width="0.5"/>
  </g>

  <g class="c-coral">
    <circle cx="610" cy="140" r="10" stroke-width="0.5"/>
    <circle cx="610" cy="187" r="10" stroke-width="0.5"/>
    <circle cx="610" cy="234" r="10" stroke-width="0.5"/>
    <circle cx="610" cy="281" r="10" stroke-width="0.5"/>
  </g>

  <!-- Q-value labels -->
  <text class="ts" x="626" y="144" dominant-baseline="central">Q (NOOP)</text>
  <text class="ts" x="626" y="191" dominant-baseline="central">Q (FIRE)</text>
  <text class="ts" x="626" y="238" dominant-baseline="central">Q (LEFT)</text>
  <text class="ts" x="626" y="285" dominant-baseline="central">Q (RIGHT)</text>

  <!-- Ellipsis dots (only on layers with more units than drawn) -->
  <g fill="var(--t)" opacity="0.5">
    <circle cx="155" cy="318" r="2.5"/><circle cx="155" cy="330" r="2.5"/><circle cx="155" cy="342" r="2.5"/>
    <circle cx="255" cy="318" r="2.5"/><circle cx="255" cy="330" r="2.5"/><circle cx="255" cy="342" r="2.5"/>
    <circle cx="355" cy="318" r="2.5"/><circle cx="355" cy="330" r="2.5"/><circle cx="355" cy="342" r="2.5"/>
    <circle cx="520" cy="325" r="2.5"/><circle cx="520" cy="337" r="2.5"/><circle cx="520" cy="349" r="2.5"/>
  </g>

  <!-- ── LAYER LABELS (bottom) ── -->
  <text class="ts" x="50"  y="390" text-anchor="middle">Input</text>
  <text class="ts" x="50"  y="405" text-anchor="middle">4 frames</text>

  <text class="ts" x="155" y="390" text-anchor="middle">Conv1</text>
  <text class="ts" x="155" y="405" text-anchor="middle">32 maps</text>
  <text class="ts" x="155" y="420" text-anchor="middle">k=8, s=4</text>

  <text class="ts" x="255" y="390" text-anchor="middle">Conv2</text>
  <text class="ts" x="255" y="405" text-anchor="middle">64 maps</text>
  <text class="ts" x="255" y="420" text-anchor="middle">k=4, s=2</text>

  <text class="ts" x="355" y="390" text-anchor="middle">Conv3</text>
  <text class="ts" x="355" y="405" text-anchor="middle">64 maps</text>
  <text class="ts" x="355" y="420" text-anchor="middle">k=3, s=1</text>

  <text class="ts" x="435" y="390" text-anchor="middle">Flatten</text>
  <text class="ts" x="435" y="405" text-anchor="middle">3 136</text>

  <text class="ts" x="520" y="390" text-anchor="middle">FC1</text>
  <text class="ts" x="520" y="405" text-anchor="middle">512 + ReLU</text>

  <text class="ts" x="610" y="390" text-anchor="middle">Salida</text>
  <text class="ts" x="610" y="405" text-anchor="middle">4 Q-values</text>

  <!-- ── ACTIVATIONS (top) ── -->
  <text class="ts" x="155" y="55" text-anchor="middle">ReLU</text>
  <text class="ts" x="255" y="55" text-anchor="middle">ReLU</text>
  <text class="ts" x="355" y="55" text-anchor="middle">ReLU</text>
  <text class="ts" x="520" y="70" text-anchor="middle">ReLU</text>
  <text class="ts" x="610" y="110" text-anchor="middle">lineal</text>

  <!-- ── LEGEND ── -->
  <g class="c-gray"><circle cx="52"  cy="460" r="7" stroke-width="0.5"/></g>
  <text class="ts" x="65"  y="460" dominant-baseline="central">Entrada (4 frames apilados)</text>

  <g class="c-purple"><circle cx="52" cy="480" r="7" stroke-width="0.5"/></g>
  <text class="ts" x="65"  y="480" dominant-baseline="central">Capa convolucional</text>

  <g class="c-teal"><circle cx="52"  cy="500" r="7" stroke-width="0.5"/></g>
  <text class="ts" x="65"  y="500" dominant-baseline="central">Flatten / Fully Connected</text>

  <g class="c-coral"><circle cx="52"  cy="520" r="7" stroke-width="0.5"/></g>
  <text class="ts" x="65"  y="520" dominant-baseline="central">Salida (Q-values por acción)</text>
</svg>

</body>
</html>
